# Publishes to PyPI when a GitHub release is published. Needs a trusted publisher
# on PyPI for this repo, workflow "publish.yml" and environment "pypi":
# https://docs.pypi.org/trusted-publishers/
name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
